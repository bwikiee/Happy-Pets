<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Xem sản phẩm</title>
  <link rel="stylesheet" href="spham.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <button onclick="window.location.href='tìm kiếm.html'">⬅ Quay lại</button>
    <div class="logo">🐾 Happy Pets</div>
    <div class="cart" onclick="goCart()">
    <i class="fa-solid fa-cart-shopping"></i>
  </div>
   
</div>
  </div>

  <!-- MAIN -->
  <div class="container">

    <!-- LEFT: IMAGE -->
    <div class="image-box">
      <img src="suatam.jpg" alt="product" class="main-img" />

      <div class="thumbs">
        <img src="hong.jpg" />
        <img src="vang.jpg" />
        <img src="xanh.png" />
      </div>
    </div>

    <!-- RIGHT: INFO -->
    <div class="info-box">

      <h1> Sữa tắm DEAR DOKET cho chó mèo đủ hương trị ve, rận, giúp mượt lông </h1>

      <p class="price">35.000đ - 69.000đ</p>

      <p class="rating">⭐ 4.9 | 5.0k đánh giá</p>

      <p class="stock">Còn hàng: 56 sản phẩm</p>

      <!-- QUANTITY -->
      <div class="qty">
        <button>-</button>
        <input type="number" value="1" />
        <button>+</button>
      </div>

      <!-- BUTTONS -->
      <div class="actions">
        <button class="cart-btn" onclick="addToCart()">+ Thêm vào giỏ</button>
        <button class="buy-btn">Mua ngay</button>
      </div>

    </div>

  </div>

  <!-- DESCRIPTION -->
  <div class="desc">
    <h2>Mô tả sản phẩm</h2>
    <p>
      SỮA TẮM SIÊU THƠM, DƯỠNG DA, HỖ TRỢ SẠCH NẤM DA, VE, RẬN, BỌ CHÉT Ở CHÓ MÈO
    </p>
  </div>

  <!-- REVIEWS -->
  <div class="reviews">
    <h2>Đánh giá khách hàng</h2>

    <div class="review-item">
      <b>Nguyễn A</b>
      <p>⭐⭐⭐⭐⭐ Sản phẩm rất tốt!</p>
    </div>


  </div>
<script>
function addToCart() {
  const name = document.querySelector(".info-box h1").innerText;
  const price = 35000;
  const quantity = parseInt(document.querySelector(".qty input").value);

  let image = document.querySelector(".main-img").getAttribute("src");

  if (image.includes("file:///")) {
    image = image.split("/").pop(); 
  }

  if (image.includes("github.io")) {
    image = image.split("/").pop();   }

  const product = {
    id: 3,
    name: name,
    price: price,
    quantity: quantity,
    image: image
  };

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  let existing = cart.find(item => item.id === product.id);

  if (existing) {
    existing.quantity += quantity;
  } else {
    cart.push(product);
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Đã thêm vào giỏ hàng!");
}
function goCart() {
  window.location.href = "XemGH.html";
}
</script>
</body>
</html>
